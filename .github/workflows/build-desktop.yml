name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Convert-HEIC-to-JPG-${{ matrix.platform }} --collect-all pillow_heif
          --collect-all tkinterdnd2 convert.py

      - name: Package Linux executable
        if: matrix.platform == 'linux-x64'
        run: tar -C dist -czf dist/Convert-HEIC-to-JPG-linux-x64.tar.gz Convert-HEIC-to-JPG-linux-x64

      - name: Upload Windows executable artifact
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: Convert-HEIC-to-JPG-windows-x64
          path: dist/Convert-HEIC-to-JPG-windows-x64.exe
          if-no-files-found: error

      - name: Upload Linux executable artifact
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: Convert-HEIC-to-JPG-linux-x64
          path: dist/Convert-HEIC-to-JPG-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes
